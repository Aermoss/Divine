name: Build

on:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source.
        uses: actions/checkout@v4

      - name: Install LLVM.
        run: choco install llvm -y

      - name: Build compiler.
        run: .\bin\zirconc.exe src/Main.zir -o zirconc.exe -L"C:\Program Files\LLVM\lib" -lLLVM-C -lDbgHelp -g -v

      - name: Upload artifact.
        uses: actions/upload-artifact@v4
        with:
          name: zirconc-windows-amd64
          path: zirconc.exe
