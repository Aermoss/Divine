name: Build

on:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source.
        uses: actions/checkout@v4

      - name: Install LLVM.
        run: choco install llvm --version=22.1.0 -y

      - name: Build compiler.
        run: |
          ren divinec.exe old_divinec.exe
          .\old_divinec.exe main.div start.div -O0 -Llib -lLLVM-C -o divinec.exe

      - name: Upload artifact.
        uses: actions/upload-artifact@v4
        with:
          name: divinec-windows-amd64
          path: divinec.exe