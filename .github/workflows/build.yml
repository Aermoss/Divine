name: Build

on:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source.
        uses: actions/checkout@v4

      - name: Install LLVM.
        run: choco install llvm --version=22.1.0 -y

      - name: Build compiler.
        run: |
          ren divinec.exe old_divinec.exe
          .\old_divinec.exe main.div start.div -O0 -Llib -lLLVM-C -o divinec.exe

      - name: Upload artifact.
        uses: actions/upload-artifact@v4
        with:
          name: divinec-windows-amd64
          path: divinec.exe

  build-linux:
    runs-on: windows-latest

    steps:
      - name: Checkout source.
        uses: actions/checkout@v4

      - name: Install LLVM.
        run: choco install llvm --version=22.1.0 -y

      - name: Download LLVM for linux.
        run: |
          curl -L -o llvm-linux.tar.xz https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.0/LLVM-22.1.0-Linux-X64.tar.xz
          tar -xf llvm-linux.tar.xz LLVM-22.1.0-Linux-X64/lib/libLLVM-22.so

      - name: Cross-compile for Linux.
        run: |
          set PATH=C:\Program Files\LLVM\bin;%PATH%
          .\divinec.exe main.div start.div -O0 -LLLVM-22.1.0-Linux-X64\lib -lLLVM-22 -target x86_64-unknown-linux-gnu -o divinec

      - name: Upload artifact.
        uses: actions/upload-artifact@v4
        with:
          name: divinec-linux-amd64
          path: divinec